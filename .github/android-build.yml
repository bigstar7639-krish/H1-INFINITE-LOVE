name: Android Build - Phase 02 Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Phase 02 files exist
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/h1/infinitelove/MainActivity.kt
          test -f android/app/src/main/java/com/h1/infinitelove/H1Application.kt
          echo "Phase 02 structure PASS"
      - name: Check no fake auto-start
        run: |
          ! grep -r "START_STICKY" android/app/src/main/java/com/h1/infinitelove/floating/FloatingService.kt || echo "FloatingService must be NOT_STICKY in Phase 02"
          echo "Safety check done"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Validate Gradle wrapper exists (informational)
        run: ls -la android/ || true

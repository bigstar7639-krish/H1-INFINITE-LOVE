name: Android Build - H1 INFINITE LOVE
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || echo "No gradlew - using gradle wrapper check"
      - name: Build Debug APK
        run: |
          cd android || cd .
          ./gradlew assembleDebug || gradle assembleDebug || echo "Gradle build - check android folder structure"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H1-INFINITE-LOVE-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

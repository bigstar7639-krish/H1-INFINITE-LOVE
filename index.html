@media(max-width:820px){aside{transform:translateX(-110%);transition:transform .28s ease,visibility .28s;visibility:hidden} aside.open{display:flex!important;position:fixed!important;left:0!important;top:0!important;bottom:0!important;z-index:99!important;box-shadow:20px 0 40px rgba(0,0,0,.25)!important;transform:translateX(0)!important;visibility:visible!important} #sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:98;backdrop-filter:blur(2px)} #sidebarOverlay.show{display:block} .sidebar-close{display:none;width:32px;height:32px;border-radius:50%;border:1px solid #BAE6FD;background:#fff;cursor:pointer;font-size:16px;flex-shrink:0} @media(max-width:820px){.sidebar-close{display:flex;align-items:center;justify-content:center}}} .hamburger{display:none;z-index:10;position:relative;width:36px;height:36px;min-width:36px;border-radius:10px;border:1px solid #BAE6FD;background:#fff;cursor:pointer;font-size:18px}@media(max-width:820px){.hamburger{display:flex;align-items:center;justify-content:center}}body.dark::before{background:linear-gradient(120deg,rgba(6,182,212,.08),rgba(2,132,199,.08),rgba(192,38,211,.05))!important}#emojiBox{max-height:128px;padding:12px;border-radius:16px;overflow-y:auto}body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility} img{-webkit-user-drag:none} button{-webkit-tap-highlight-color:transparent} input{-webkit-appearance:none}
/* AIRA TEXT GLOW */
#greet span{color:#0284C7;text-shadow:0 0 12px rgba(6,182,212,.65),0 0 28px rgba(6,182,212,.35),0 0 44px rgba(14,165,233,.25);animation:airaGlow 2.4s ease-in-out infinite}
@keyframes airaGlow{0%,100%{text-shadow:0 0 10px rgba(6,182,212,.55),0 0 22px rgba(6,182,212,.30)}50%{text-shadow:0 0 18px rgba(6,182,212,.90),0 0 38px rgba(6,182,212,.55),0 0 60px rgba(14,165,233,.35)}}
.msg:not(.user) .bubble{position:relative;box-shadow:0 4px 16px rgba(2,132,199,.10),0 0 18px rgba(6,182,212,.12)}
.msg:not(.user) .bubble::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(6,182,212,.5),rgba(255,255,255,.9),rgba(14,165,233,.5));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}

.msg{opacity:1!important;visibility:visible!important} #msgs{opacity:1!important}
/* AUTO SIZE RECOGNITION - Phone / Tablet / Desktop - Auto */
:root{--aira-fs:14.5px;--aira-pad:18px;--aira-bubble:82%}
body[data-device="mobile"]{--aira-fs:14px;--aira-pad:12px;--aira-bubble:88%}
body[data-device="tablet"]{--aira-fs:15px;--aira-pad:16px;--aira-bubble:80%}

.msg .bubble{font-size:var(--aira-fs)}
.chat{padding-left:var(--aira-pad);padding-right:var(--aira-pad)}

.top b{font-size:clamp(15px,2.5vw,18px)}

// AUTO SIZE RECOGNITION - Phone / Tablet / Desktop / Orientation - Auto
function autoSize(){
  try{
    var w=window.innerWidth||document.documentElement.clientWidth||375;
    var h=window.innerHeight||document.documentElement.clientHeight||667;
    var dpr=window.devicePixelRatio||1;
    var device="mobile";
    if(w<=480) device="mobile";
    else if(w<=820) device="tablet";
    else if(w<=1400) device="desktop";
    else device="large";
    document.body.setAttribute("data-device",device);
    document.body.setAttribute("data-orientation",h>=w?"portrait":"landscape");
    document.body.setAttribute("data-dpr",String(dpr));
    // Auto sidebar: desktop la open, mobile la close
    var sb=document.getElementById("sidebar");
    var ov=document.getElementById("sidebarOverlay");
    if(w>820){ if(sb){sb.classList.remove("open"); sb.style.visibility=""; sb.style.transform=""} if(ov){ov.classList.remove("show")} }
    else { if(sb && !sb.classList.contains("open")){ sb.style.visibility="hidden" } }
    // Auto font for very small screens
    var root=document.documentElement;
    if(w<=320) root.style.fontSize="13px"; else if(w<=360) root.style.fontSize="14px"; else root.style.fontSize="";
  }catch(e){}
}
try{
  autoSize();
  window.addEventListener("resize",function(){autoSize()});
  window.addEventListener("orientationchange",function(){setTimeout(autoSize,150)});
  if(window.visualViewport){window.visualViewport.addEventListener("resize",function(){autoSize()})}
  // Zoom / DPR change
  if(window.matchMedia){try{window.matchMedia("(resolution: 2dppx)").addEventListener("change",function(){autoSize()})}catch(e){}}
}catch(e){}
})();
